[project]
name = "ntfsafe"
version = "0.3.9"
description = "Preflight scanner for copying file trees to NTFS/Windows/macOS-compatible storage"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7,!=6.12.0,<7"]

[dependency-groups]
dev = [
    "pre-commit>=4,<5",
    "ruff>=0.11,<1",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

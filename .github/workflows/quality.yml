name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Run pre-commit checks
        run: uv run --locked pre-commit run --all-files

      - name: Check Python syntax
        run: uv run --locked python -m compileall -q src

      - name: Check CLI startup
        run: uv run --locked python src/ntfsafe.py --help

      - name: Run GUI regression tests
        run: uv run --locked python -m unittest discover -s tests -v
